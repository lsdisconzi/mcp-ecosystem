                    if (panel) panel.classList.toggle('active', p === name);
                });
                var tabs = document.querySelectorAll('#jurisprudenciaView .jr-tab');
                tabs.forEach(function (t) {
                    t.classList.toggle('active', t.getAttribute('data-panel') === name);
                });
                // re-render sob demanda
                if (name === 'dashboard') renderDashboard();
                if (name === 'biblioteca') renderBiblioteca();
                if (name === 'alertas') renderAlertas();
                if (name === 'admin') renderAdmin();
            };

            window.jurisprudenciaGlobalSearch = function () {
                var input = document.getElementById('jrGlobalInput');
                var query = (input.value || '').trim();
                if (!query) return;
                // salvar histórico
                if (jrSearchHistory.indexOf(query) === -1) {
                    jrSearchHistory.unshift(query);
                    if (jrSearchHistory.length > 20) jrSearchHistory.pop();
                    localStorage.setItem('jrSearchHistory', JSON.stringify(jrSearchHistory));
                }
                document.getElementById('jrSuggestions').classList.remove('open');
                jurisprudenciaSwitchPanel('pesquisa');
                renderPesquisa(query);
            };

            window.jurisprudenciaGlobalSuggest = function (val) {
                var sug = document.getElementById('jrSuggestions');
                if (!val || val.length < 2) { sug.classList.remove('open'); return; }
                var q = val.toLowerCase();
                var matches = [];
                var seen = {};
                MOCK_JULGADOS.forEach(function (j) {
                    if (j.processo.toLowerCase().indexOf(q) !== -1 && !seen[j.processo]) {
                        seen[j.processo] = true;
                        matches.push({ label: j.processo, type: 'Processo' });
                    }
                    if (j.relator.toLowerCase().indexOf(q) !== -1 && !seen[j.relator]) {
                        seen[j.relator] = true;
                        matches.push({ label: j.relator, type: 'Relator' });
                    }
                    j.assuntos.forEach(function (a) {
                        if (a.toLowerCase().indexOf(q) !== -1 && !seen[a]) {
                            seen[a] = true;
                            matches.push({ label: a, type: 'Assunto' });
                        }
                    });
                });
                if (!matches.length) { sug.classList.remove('open'); return; }
                sug.innerHTML = '';
                matches.slice(0, 8).forEach(function (m) {
                    var div = document.createElement('div');
                    div.className = 'jr-sug-item';
                    div.innerHTML = '<span class="jr-sug-type">' + esc(m.type) + '</span>' + esc(m.label);
                    div.onclick = function () {
                        document.getElementById('jrGlobalInput').value = m.label;
                        sug.classList.remove('open');
                        jurisprudenciaGlobalSearch();
                    };
                    sug.appendChild(div);
                });
                sug.classList.add('open');
            };

            window.jurisprudenciaFiltrar = function () {
                var query = document.getElementById('jrFiltroRelator') ? document.getElementById('jrFiltroRelator')
                    .value : '';
                var assunto = document.getElementById('jrFiltroAssunto') ? document.getElementById('jrFiltroAssunto')
                    .value : '';
                var resultado = document.getElementById('jrFiltroResultado') ? document.getElementById(
                    'jrFiltroResultado').value : '';
                var lei = document.getElementById('jrFiltroLei') ? document.getElementById('jrFiltroLei').value : '';

                var results = MOCK_JULGADOS;
                if (query) results = results.filter(function (j) {
                    return j.relator.toLowerCase().indexOf(query
                        .toLowerCase()) !== -1;
                });
                if (assunto) results = results.filter(function (j) {
                    return j.assuntos.some(function (a) {
                        return a
                            .toLowerCase().indexOf(assunto.toLowerCase()) !== -1;
                    });
                });
                if (resultado) results = results.filter(function (j) { return j.outcome === resultado; });
                if (lei) results = results.filter(function (j) {
                    return j.legislacao_citada.some(function (l) {
                        return l
                            .toLowerCase().indexOf(lei.toLowerCase()) !== -1;
                    });
                });

                // também aplicar filtros globais
                var tribunalFiltro = document.getElementById('jrFilterTribunal');
                var anoFiltro = document.getElementById('jrFilterAno');
                if (tribunalFiltro && tribunalFiltro.value) {
                    results = results.filter(function (j) { return j.tribunal === tribunalFiltro.value; });
                }
                if (anoFiltro && anoFiltro.value) {
                    results = results.filter(function (j) { return j.data_julgamento.slice(0, 4) === anoFiltro.value; });
                }

                jrFiltered = results;
                renderPesquisaComFiltros(results);
            };

            function renderPesquisaComFiltros(results) {
                var el = document.getElementById('jrPesquisaContent');
                if (!el) return;
                // reutiliza a mesma lógica de renderPesquisa mas com os resultados já filtrados
                var html = '';
                html += '<div class="jr-filter-bar">';
                html += '<div class="jr-filter-group"><label>Relator</label><input id="jrFiltroRelator" placeholder="Nome…" oninput="jurisprudenciaFiltrar()" /></div>';
                html += '<div class="jr-filter-group"><label>Assunto</label><input id="jrFiltroAssunto" placeholder="Assunto…" oninput="jurisprudenciaFiltrar()" /></div>';
                html += '<div class="jr-filter-group"><label>Resultado</label><select id="jrFiltroResultado" onchange="jurisprudenciaFiltrar()"><option value="">Todos</option><option value="Deu Provimento">Deu Provimento</option><option value="Negou Provimento">Negou Provimento</option><option value="Parcial">Parcial</option><option value="Não Conhecido">Não Conhecido</option></select></div>';
                html += '<div class="jr-filter-group"><label>Lei</label><input id="jrFiltroLei" placeholder="Lei…" oninput="jurisprudenciaFiltrar()" /></div>';
                html += '<div class="jr-filter-actions"><button class="btn-sm primary" onclick="jurisprudenciaFiltrar()"><i class="fas fa-filter"></i> Filtrar</button>';
                html +=
                    '<button class="btn-sm" onclick="jurisprudenciaLimparFiltros()"><i class="fas fa-times"></i> Limpar</button></div>';
                html += '</div>';

                html += '<div class="jr-results-header"><div class="jr-count"><strong>' + results.length +
                    '</strong> julgados encontrados</div><div class="jr-export-actions">';
                html +=
                    '<button class="btn-sm" onclick="jurisprudenciaExport(\'csv\')"><i class="fas fa-file-csv"></i> CSV</button>';
                html +=
                    '<button class="btn-sm" onclick="jurisprudenciaExport(\'excel\')"><i class="fas fa-file-excel"></i> Excel</button>';
                html +=
                    '<button class="btn-sm" onclick="jurisprudenciaExport(\'pdf\')"><i class="fas fa-file-pdf"></i> PDF</button>';
                html += '</div></div>';

                results.slice(0, 30).forEach(function (j) {
                    var outcomeClass = '';
                    if (j.outcome === 'Deu Provimento') outcomeClass = 'granted';
                    else if (j.outcome === 'Negou Provimento') outcomeClass = 'denied';
                    var snippet = j.ementa_snippet || j.ementa.slice(0, 150) + '…';
                    html += '<div class="jr-result-item" onclick="jurisprudenciaOpenDetail(\'' + j.id + '\')">';
                    html += '<div class="jr-result-top">';
                    html += '<span class="jr-processo">' + esc(j.processo) + '</span>';
                    html += '<span class="jr-meta">' + esc(j.tribunal) + ' · ' + esc(j.orgao_julgador) +
                        ' · ' + formatDate(j.data_julgamento) + '</span>';
                    html += '<span class="jr-meta"><strong>' + esc(j.relator) + '</strong></span>';
                    html += '<span class="jr-outcome ' + outcomeClass + '">' + esc(j.outcome) + '</span>';
                    html += '</div>';
                    html += '<div class="jr-result-snippet">' + snippet + '</div>';
                    html += '<div class="jr-result-bottom">';
                    j.assuntos.forEach(function (a) { html += '<span class="jr-tag">' + esc(a) + '</span>'; });
                    j.artigos_citados.forEach(function (a) {
                        html += '<span class="jr-tag">' + esc(a) +
                        '</span>';
                    });
                    if (isFavorited(j.id)) html +=
                        '<span class="jr-tag" style="color:var(--amber);"><i class="fas fa-star"></i></span>';
                    html += '</div></div>';
                });

                if (!results.length) {
                    html +=
                        '<div style="text-align:center;padding:40px 0;color:var(--gray);"><i class="fas fa-search" style="font-size:28px;display:block;margin-bottom:12px;"></i> Nenhum julgado encontrado</div>';
                }
                el.innerHTML = html;
            }

            window.jurisprudenciaLimparFiltros = function () {
                var inputs = document.querySelectorAll('#jrPesquisaContent input');
                inputs.forEach(function (inp) { inp.value = ''; });
                var selects = document.querySelectorAll('#jrPesquisaContent select');
                selects.forEach(function (sel) { sel.value = ''; });
                // também limpa os globais
                var tf = document.getElementById('jrFilterTribunal');
                var af = document.getElementById('jrFilterAno');
                if (tf) tf.value = '';
                if (af) af.value = '';
                renderPesquisa('');
            };

            window.jurisprudenciaSearchAssunto = function (assunto) {
                document.getElementById('jrGlobalInput').value = assunto;
                jurisprudenciaSwitchPanel('pesquisa');
                renderPesquisa(assunto);
            };

            window.jurisprudenciaSearchRelator = function (relator) {
                document.getElementById('jrGlobalInput').value = relator;
                jurisprudenciaSwitchPanel('pesquisa');
                renderPesquisa(relator);
            };

            window.jurisprudenciaSearchCamara = function (camara) {
                document.getElementById('jrGlobalInput').value = camara;
                jurisprudenciaSwitchPanel('pesquisa');
                renderPesquisa(camara);
            };

            window.jurisprudenciaSearchAssuntoCamara = function (assunto, camara) {
                document.getElementById('jrGlobalInput').value = assunto + ' ' + camara;
                jurisprudenciaSwitchPanel('pesquisa');
                renderPesquisa(assunto + ' ' + camara);
            };

            window.jurisprudenciaSearchLei = function (lei) {
                document.getElementById('jrGlobalInput').value = lei;
                jurisprudenciaSwitchPanel('pesquisa');
                renderPesquisa(lei);
            };

            window.jurisprudenciaSearchArtigo = function (artigo) {
                document.getElementById('jrGlobalInput').value = artigo;
                jurisprudenciaSwitchPanel('pesquisa');
                renderPesquisa(artigo);
            };

            // ── DETALHE ────────────────────────────────────────────────────────────
            window.jurisprudenciaOpenDetail = function (id) {
                var j = getJulgado(id);
                if (!j) return;
                var related = getRelated(j, 5);
                var timeline = getTimeline(j);

                var card = document.getElementById('jrDetailCard');
                var outcomeClass = '';
                if (j.outcome === 'Deu Provimento') outcomeClass = 'granted';
                else if (j.outcome === 'Negou Provimento') outcomeClass = 'denied';

                var html = '';
                html +=
                    '<button class="jr-detail-close" onclick="jurisprudenciaCloseDetail()"><i class="fas fa-times"></i></button>';
                html += '<div class="jr-detail-head">';
                html += '<div class="jr-detail-processo">' + esc(j.processo) + '</div>';
                html += '<div class="jr-detail-meta-row">';
                html += '<span><strong>Tribunal:</strong> ' + esc(j.tribunal) + '</span>';
                html += '<span><strong>Órgão:</strong> ' + esc(j.orgao_julgador) + '</span>';
                html += '<span><strong>Relator:</strong> ' + esc(j.relator) + '</span>';
                html += '<span><strong>Data:</strong> ' + formatDate(j.data_julgamento) + '</span>';
                html += '<span><strong>Classe:</strong> ' + esc(j.classe) + '</span>';
                html += '<span><strong>Votação:</strong> ' + esc(j.votacao) + '</span>';
                html += '<span><strong>Resultado:</strong> <span style="color:' + (j.outcome === 'Deu Provimento' ?
                    'var(--green)' : j.outcome === 'Negou Provimento' ? 'var(--red)' : 'var(--amber)') + ';font-weight:600;">' +
                    esc(j.outcome) + '</span></span>';
                html += '</div></div>';

                html += '<div class="jr-detail-body">';
                html += '<h4>Ementa</h4>';
                html += '<div class="jr-ementa">' + esc(j.ementa).replace(/\n/g, '<br>') + '</div>';

                html += '<h4>Assuntos</h4>';
                html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;">';
                j.assuntos.forEach(function (a) { html += '<span class="jr-tag">' + esc(a) + '</span>'; });
                html += '</div>';

                html += '<h4>Legislação citada</h4>';
                html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;">';
                j.legislacao_citada.forEach(function (l) {
                    html += '<span class="jr-tag">' + esc(l) +
                    '</span>';
                });
                html += '</div>';

                html += '<h4>Artigos citados</h4>';
                html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;">';
                j.artigos_citados.forEach(function (a) {
                    html += '<span class="jr-tag">' + esc(a) +
                    '</span>';
                });
                html += '</div>';

                html += '<h4>Partes</h4>';
                html += '<div style="font-size:12px;color:var(--gray-hi);margin-bottom:10px;">';
                html += '<span><strong>Autor:</strong> ' + esc(j.partes.autor || '—') + '</span> · ';
                html += '<span><strong>Réu:</strong> ' + esc(j.partes.reu || '—') + '</span> · ';
                html += '<span><strong>Apelante:</strong> ' + esc(j.partes.apelante || '—') + '</span>';
                html += '</div>';

                // Correlações
                if (related.length) {
                    html += '<h4>Correlações <span style="font-weight:400;font-size:10px;color:var(--gray);">(clique para abrir)</span></h4>';
                    html += '<div class="jr-correlations">';
                    related.forEach(function (r) {
                        html += '<span class="jr-corr-chip" onclick="jurisprudenciaOpenDetail(\'' + r.id +
                            '\');event.stopPropagation();">' + esc(r.processo) + ' · ' + esc(r
                                .outcome) + '</span>';
                    });
                    html += '</div>';
                }

                // Linha do tempo
                if (timeline.length) {
                    html += '<h4 style="margin-top:14px;">Linha do Tempo — ' + esc(j.relator) +
                        ' <span style="font-weight:400;font-size:10px;color:var(--gray);">(decisões próximas)</span></h4>';
                    html += '<div class="jr-timeline">';
                    timeline.forEach(function (t) {
                        html += '<div class="jr-tl-item"><span class="jr-tl-date">' + formatDate(t
                            .data_julgamento) + '</span> ' + esc(t.processo) + ' — ' + esc(t
                                .outcome) + ' <span style="color:var(--gray);font-size:10px;">' + esc(t
                                    .assuntos[0] || '') + '</span></div>';
                    });
                    html += '</div>';
                }

                html += '</div>'; // body

                // Ações
                var fav = isFavorited(j.id);
                var lib = isInLibrary(j.id);
                html += '<div class="jr-detail-actions">';
                html +=
                    '<button class="btn-sm ' + (fav ? 'active' : '') + '" onclick="jurisprudenciaToggleFavorito(\'' +
                    j.id + '\')"><i class="fas fa-star"></i> ' + (fav ? 'Favoritado' : 'Favoritar') + '</button>';
                html +=
                    '<button class="btn-sm ' + (lib ? 'active' : '') + '" onclick="jurisprudenciaToggleBiblioteca(\'' +
                    j.id + '\')"><i class="fas fa-bookmark"></i> ' + (lib ? 'Na biblioteca' :
                        'Adicionar à biblioteca') + '</button>';
                html +=
                    '<button class="btn-sm" onclick="jurisprudenciaExportarJulgado(\'' + j.id +
                    '\')"><i class="fas fa-file-pdf"></i> Exportar</button>';
                html += '</div>';

                card.innerHTML = html;
                document.getElementById('jrDetail').classList.add('open');
            };

            window.jurisprudenciaCloseDetail = function () {
                document.getElementById('jrDetail').classList.remove('open');
            };

            // ── FAVORITOS / BIBLIOTECA ─────────────────────────────────────────────
            window.jurisprudenciaToggleFavorito = function (id) {
                var idx = jrFavorites.indexOf(id);
                if (idx === -1) jrFavorites.push(id);
                else jrFavorites.splice(idx, 1);
                localStorage.setItem('jrFavorites', JSON.stringify(jrFavorites));
                // re-render se estiver aberto
                if (document.getElementById('jrDetail').classList.contains('open')) {
                    jurisprudenciaOpenDetail(id);
                }
                renderBiblioteca();
            };

            window.jurisprudenciaToggleBiblioteca = function (id) {
                var idx = jrLibrary.indexOf(id);
                if (idx === -1) jrLibrary.push(id);
                else jrLibrary.splice(idx, 1);
                localStorage.setItem('jrLibrary', JSON.stringify(jrLibrary));
                if (document.getElementById('jrDetail').classList.contains('open')) {
                    jurisprudenciaOpenDetail(id);
                }
                renderBiblioteca();
            };

            window.jurisprudenciaExportarJulgado = function (id) {
                var j = getJulgado(id);
                if (!j) return;
                var txt = 'PROCESSO: ' + j.processo + '\n' +
                    'TRIBUNAL: ' + j.tribunal + '\n' +
                    'RELATOR: ' + j.relator + '\n' +
                    'ÓRGÃO: ' + j.orgao_julgador + '\n' +
                    'DATA: ' + formatDate(j.data_julgamento) + '\n' +
                    'RESULTADO: ' + j.outcome + '\n' +
                    'ASSUNTOS: ' + j.assuntos.join(', ') + '\n' +
                    'LEGISLAÇÃO: ' + j.legislacao_citada.join(', ') + '\n' +
                    'ARTIGOS: ' + j.artigos_citados.join(', ') + '\n\n' +
                    'EMENTA:\n' + j.ementa;
                alert('Exportação simulada (PDF). Conteúdo:\n\n' + txt.slice(0, 600) + (txt.length > 600 ? '…' : ''));
            };

            // ── EXPORT ─────────────────────────────────────────────────────────────
            window.jurisprudenciaExport = function (format) {
                var data = jrFiltered.length ? jrFiltered : MOCK_JULGADOS;
                var headers = ['Processo', 'Tribunal', 'Relator', 'Órgão', 'Data', 'Classe', 'Resultado', 'Assuntos'];
                var rows = data.slice(0, 50).map(function (j) {
                    return [
                        j.processo, j.tribunal, j.relator, j.orgao_julgador,
                        formatDate(j.data_julgamento), j.classe, j.outcome,
                        j.assuntos.join('; ')
                    ];
                });
                var csv = headers.join(',') + '\n' + rows.map(function (r) { return r.join(','); }).join('\n');
                var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                var link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'jurisprudencia.' + (format === 'csv' ? 'csv' : 'txt');
                link.click();
                URL.revokeObjectURL(link.href);
                alert('Exportação ' + format.toUpperCase() + ' gerada com ' + rows.length + ' registros.');
            };

            // ── ALERTAS ────────────────────────────────────────────────────────────
            window.jurisprudenciaCriarAlerta = function () {
                var input = document.getElementById('jrNovoAlerta');
                var query = (input.value || '').trim();
                if (!query) { alert('Digite uma consulta para o alerta.'); return; }
                jrAlerts.push({ query: query, created: new Date().toLocaleDateString('pt-BR'), count: 0 });
                localStorage.setItem('jrAlerts', JSON.stringify(jrAlerts));
                input.value = '';
                renderAlertas();
                alert('Alerta criado: "' + query + '"');
            };

            window.jurisprudenciaRemoverAlerta = function (idx) {
                jrAlerts.splice(idx, 1);
                localStorage.setItem('jrAlerts', JSON.stringify(jrAlerts));
                renderAlertas();
            };

            // ── REFRESH ────────────────────────────────────────────────────────────
            window.jurisprudenciaRefresh = function () {
                // simula atualização
                MOCK_JULGADOS = gerarMock();
                renderDashboard();
                renderPesquisa('');
                renderAnalises();
                renderBiblioteca();
                renderAlertas();
                renderAdmin();
                alert('Dados atualizados! ' + MOCK_JULGADOS.length + ' julgados indexados.');
            };

            // ── LIFECYCLE: SHOW / HIDE ────────────────────────────────────────────
            var JR_SIBLING_HIDE = ['violationsHideView', 'lawLibHideView', 'masterIndexHideView',
                'legalRouterHideView', 'spacesHideView', 'listeningHideView', 'studioHideView',
                'descobertaHideView', 'memoryHideView', 'shadersHideView', 'architectureHideView',
                'craudioHideView'
            ];
            var JR_CHAT_IDS = ['chatHeader', 'welcomeState', 'chatLog', 'chatCompose', 'chatToolbar'];

            window.jurisprudenciaShowView = function () {
                build();
                JR_CHAT_IDS.forEach(function (id) {
                    var el = document.getElementById(id);
                    if (el) el.style.display = 'none';
                });
                var mc = document.querySelector('.main-content');
                if (mc) {
                    mc._jrDisplay = mc.style.display;
                    mc.style.display = 'none';
                }
                if (typeof window.aexHideMain === 'function') { try { window.aexHideMain(); } catch (_e) { } }
                JR_SIBLING_HIDE.forEach(function (fn) {
                    try { if (typeof window[fn] === 'function') window[fn](); } catch (_e) { }
                });
                var v = document.getElementById('jurisprudenciaView');
                if (v) v.classList.add('active');
                var ws = document.querySelector('.workspace');
                if (ws) ws.classList.add('jurisprudencia-open');
                // sincroniza com o painel ativo
                jurisprudenciaSwitchPanel(jrActivePanel || 'dashboard');
            };

            window.jurisprudenciaHideView = function () {
                var v = document.getElementById('jurisprudenciaView');
                if (v) v.classList.remove('active');
                var ws = document.querySelector('.workspace');
                if (ws) ws.classList.remove('jurisprudencia-open');
                var mc = document.querySelector('.main-content');
                if (mc) {
                    mc.style.display = mc._jrDisplay !== undefined ? mc._jrDisplay : '';
                    delete mc._jrDisplay;
                }
                JR_CHAT_IDS.forEach(function (id) {
                    var el = document.getElementById(id);
                    if (el) el.style.display = '';
                });
            };

            // wrap siblings
            function wrapSiblingsJr() {
                var names = ['violationsShowView', 'lawLibShowView', 'masterIndexShowView',
                    'legalRouterShowView', 'spacesShowView', 'listeningShowView', 'studioShowView',
                    'descobertaShowView', 'memoryShowView', 'shadersShowView', 'architectureShowView',
                    'craudioShowView', 'resetToWelcome', 'aexToggleMain'
                ];
                names.forEach(function (n) {
                    var orig = window[n];
                    if (typeof orig !== 'function' || orig._jrWrapped) return;
                    var wrapped = function () {
                        try { window.jurisprudenciaHideView(); } catch (_e) { }
                        return orig.apply(this, arguments);
                    };
                    wrapped._jrWrapped = true;
                    window[n] = wrapped;
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', wrapSiblingsJr);
            } else {
                wrapSiblingsJr();
            }

        })();
    </script>
